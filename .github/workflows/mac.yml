name: mac

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    env:
      ONLY_CACHE: "false"
      LIBRARIES_CACHE_VERSION: "v3"

    steps:
      - name: clone
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: AyuGramDesktop

      - name: setup
        id: setup
        run: |
          brew install automake cmake libtool meson nasm ninja pkg-config wget
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake
          xcodebuild -version
          toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "cache-prefix=${RUNNER_OS}-${RUNNER_ARCH}-macos26-libs-${LIBRARIES_CACHE_VERSION}-${toolchain}" >> "$GITHUB_OUTPUT"

      - name: libraries cache
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.setup.outputs.cache-prefix }}-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/**', 'AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}-

      - name: libraries
        run: |
          df -h /
          ./AyuGramDesktop/Telegram/build/prepare/mac.sh silent
          df -h /

      - name: slim libraries
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/pkgconfig/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: verify libraries
        run: |
          PKG_CONFIG_PATH="$PWD/Libraries/local/lib/pkgconfig" pkg-config --print-errors --exists openh264
          test -s Libraries/local/lib/libtlottie.a
          test -s Libraries/local/include/tlottie/tlottie.h

      - name: save libraries cache
        if: success() && steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd AyuGramDesktop/Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_MAC_ARCH=arm64 \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -D CMAKE_CXX_FLAGS=-DMETA_NO_STD_FORWARD_DECLARATIONS \
            -D CMAKE_OBJCXX_FLAGS=-DMETA_NO_STD_FORWARD_DECLARATIONS \
            -D CMAKE_EXE_LINKER_FLAGS="-Wl,-x"
          cmake --build ../out --config Release --parallel

      - name: pack
        if: env.ONLY_CACHE == 'false'
        run: |
          cd AyuGramDesktop/out/Release
          strip AyuGram.app/Contents/MacOS/AyuGram
          codesign --force --sign - --deep AyuGram.app
          codesign --verify --deep --strict AyuGram.app
          ditto -c -k --sequesterRsrc --keepParent AyuGram.app ayugram-mac-arm64.zip

      - name: upload
        if: env.ONLY_CACHE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ayugram-mac
          path: AyuGramDesktop/out/Release/ayugram-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0

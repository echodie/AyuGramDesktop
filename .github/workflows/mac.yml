name: mac
run-name: mac - ${{ inputs.app_name || 'AyuGram' }} (${{ inputs.bundle_id || 'one.ayugram.AyuGramDesktop' }})

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: bundle id (also identifies the data folder)
        type: string
        default: one.ayugram.AyuGramDesktop
        required: true
      app_name:
        description: application name (without .app)
        type: string
        default: AyuGram
        required: true
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    env:
      ONLY_CACHE: "false"
      LIBRARIES_CACHE_VERSION: "v3"
      MAC_BUNDLE_ID: ${{ inputs.bundle_id || 'one.ayugram.AyuGramDesktop' }}
      MAC_APP_NAME: ${{ inputs.app_name || 'AyuGram' }}

    steps:
      - name: clone
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: AyuGramDesktop

      - name: validate application
        shell: bash
        run: |
          export LC_ALL=C
          if [[ ! "$MAC_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo '::error::invalid bundle id'
            exit 1
          fi
          if [[ ! "$MAC_APP_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9\ _-]*[A-Za-z0-9_-])?$ ]]; then
            echo '::error::invalid application name: use letters, digits, spaces, underscores or hyphens'
            exit 1
          fi

      - name: setup
        id: setup
        run: |
          brew install automake cmake libtool meson nasm ninja pkg-config wget
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake
          xcodebuild -version
          toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "cache-prefix=${RUNNER_OS}-${RUNNER_ARCH}-macos26-libs-${LIBRARIES_CACHE_VERSION}-${toolchain}" >> "$GITHUB_OUTPUT"

      - name: libraries cache
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.setup.outputs.cache-prefix }}-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/**', 'AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}-

      - name: libraries
        run: |
          df -h /
          ./AyuGramDesktop/Telegram/build/prepare/mac.sh silent
          df -h /

      - name: slim libraries
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/pkgconfig/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: verify libraries
        run: |
          PKG_CONFIG_PATH="$PWD/Libraries/local/lib/pkgconfig" pkg-config --print-errors --exists openh264
          test -s Libraries/local/lib/libtlottie.a
          test -s Libraries/local/include/tlottie/tlottie.h

      - name: save libraries cache
        if: success() && steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd AyuGramDesktop/Telegram
          ./configure.sh \
            -D AYUGRAM_MAC_BUNDLE_ID="$MAC_BUNDLE_ID" \
            -D AYUGRAM_MAC_APP_NAME="$MAC_APP_NAME" \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_MAC_ARCH=arm64 \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -D CMAKE_CXX_FLAGS=-DMETA_NO_STD_FORWARD_DECLARATIONS \
            -D CMAKE_OBJCXX_FLAGS=-DMETA_NO_STD_FORWARD_DECLARATIONS \
            -D CMAKE_EXE_LINKER_FLAGS="-Wl,-x"
          cmake --build ../out --config Release --parallel

      - name: pack
        if: env.ONLY_CACHE == 'false'
        run: |
          cd AyuGramDesktop/out/Release
          app="$MAC_APP_NAME.app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$MAC_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "$MAC_APP_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "$MAC_APP_NAME"
          strip "$app/Contents/MacOS/$MAC_APP_NAME"
          codesign --force --sign - --deep --entitlements ../../Telegram/Telegram/Telegram.entitlements "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$MAC_BUNDLE_ID-mac-arm64.zip"

      - name: upload
        if: env.ONLY_CACHE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MAC_BUNDLE_ID }}-mac-arm64
          path: AyuGramDesktop/out/Release/${{ env.MAC_BUNDLE_ID }}-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0
